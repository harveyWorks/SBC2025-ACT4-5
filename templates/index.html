{% extends 'base.html' %}
{% block title %}User List{% endblock %}
{% block content %}
<h1 class="mb-4">Users</h1>
<a href="{{ url_for('add') }}" class="btn btn-primary mb-3">Add User</a>
<table class="table table-bordered">
  <thead class="table-light">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>
        <a href="{{ url_for('update', id=user.id) }}" class="btn btn-warning btn-sm">Edit</a>
        <a href="{{ url_for('delete', id=user.id) }}" class="btn btn-danger btn-sm">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
